name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate is a shell script customers' pipelines depend on, so an unquoted
      # expansion here is a broken build for them, not just a style nit.
      - name: ShellCheck
        run: shellcheck scripts/gate.sh

      - name: Validate action metadata
        run: |
          # Marketplace requires action.yml at the root with a name, description
          # and branding; a missing key is only discovered at publish time otherwise.
          python3 - <<'PY'
          import sys, yaml
          action = yaml.safe_load(open('action.yml'))
          missing = [k for k in ('name', 'description', 'runs', 'branding') if k not in action]
          if missing:
              sys.exit(f"action.yml is missing: {', '.join(missing)}")
          for key in ('icon', 'color'):
              if key not in action['branding']:
                  sys.exit(f"action.yml branding is missing: {key}")
          print("action.yml OK")
          PY

  gate-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exercises the pure parsing/rendering the gate depends on, without needing
      # an API key or placing real calls.
      - name: Variables parsing
        run: |
          set -euo pipefail
          VARIABLES='orderNumber=12345
          customerName=John Doe
          query=a=b&c=d
          # a comment
          lineWithNoEquals'
          export VARIABLES
          eval "$(sed -n '/^variables_json()/,/^}/p' scripts/gate.sh)"
          actual="$(variables_json)"
          expected='{"orderNumber":"12345","customerName":"John Doe","query":"a=b&c=d"}'
          echo "$actual"
          [ "$actual" = "$expected" ] || { echo "expected: $expected"; exit 1; }

      - name: Rejects missing and conflicting inputs
        run: |
          set -uo pipefail
          run() { INPUT_PLAN_ID="${1:-}" INPUT_CONFIG="${2:-}" ./scripts/gate.sh >/dev/null 2>&1; echo $?; }
          [ "$(run '' '')" = '1' ] || { echo 'expected failure when neither input is set'; exit 1; }
          [ "$(run 'a-plan' 'a-file.yml')" = '1' ] || { echo 'expected failure when both are set'; exit 1; }
          echo 'input validation OK'

  cli-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The step that broke: `npm i -g` links the CLI's ~80 man pages into
      # /usr/local/share/man and dies with EACCES on a GitHub runner, so the action
      # never reached the gate at all. Installing it here, exactly as action.yml does
      # and at the version action.yml pins, is the only way that class of bug shows up
      # before a customer's pipeline hits it.
      - name: Install the pinned CLI the way the action does
        run: |
          set -euo pipefail
          version="$(python3 -c "import yaml; print(yaml.safe_load(open('action.yml'))['inputs']['cli-version']['default'])")"
          prefix="${RUNNER_TEMP}/roark-cli"
          npm install --prefix "$prefix" --no-fund --no-audit --no-save "@roarkanalytics/cli@${version}"
          printf '%s\n' "${prefix}/node_modules/.bin" >>"$GITHUB_PATH"
          echo "installed @roarkanalytics/cli@${version}"

      # Not just `--version`: the gate calls these three, so a CLI that dropped any
      # of them would pass a version check and still fail on the first real run.
      #
      # Each help text is captured in full before being matched. Piping the CLI into
      # `grep -q` races it: grep exits on the first match, and whatever the CLI
      # writes next hits a closed pipe, which it reports as an unhandled EPIPE and
      # a non-zero exit that `pipefail` then turns into a red build. Nothing is
      # wrong with the CLI when that happens, so the check must not be able to
      # produce that signal.
      - name: The commands the gate depends on exist
        run: |
          set -euo pipefail
          roark --version

          run_help="$(roark simulation run --help)"
          grep -q -- '--data' <<<"$run_help" || {
            echo '::error::`roark simulation run` no longer accepts --data'
            exit 1
          }

          poll_help="$(roark simulation plan job get --help)"
          grep -q -- 'job-id' <<<"$poll_help" || {
            echo '::error::`roark simulation plan job get` no longer takes a job id'
            exit 1
          }

          roark api post --help >/dev/null
          echo 'CLI surface OK'
